name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + JaCoCo ≥ 75%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers sobe o MySQL no Docker do runner
      - name: Testes e cobertura
        run: mvn -B verify

      - name: Relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Arquivos para o SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: sonar-backend
          path: |
            backend/target/classes/
            backend/target/site/jacoco/jacoco.xml

  frontend:
    name: Frontend (lint, build, Vitest ≥ 25%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud (quality gate)
    needs: [backend, frontend]
    # O plano gratuito do SonarCloud só analisa a main e os PRs para ela
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: sonar-backend
          path: backend/target

      - uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

      # O lcov do Vitest usa caminhos relativos a frontend/; o Sonar lê a partir da raiz
      - name: Ajustar caminhos do lcov
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
