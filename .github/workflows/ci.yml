name: CI

on:
  pull_request:
    branches: [main]
  # Os workflows de deploy chamam este para rodar os testes antes de publicar
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + JaCoCo ≥ 75%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers sobe o MySQL no Docker do runner
      - name: Testes e cobertura
        run: mvn -B verify

      - name: Relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Arquivos para o SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: sonar-backend
          path: |
            backend/target/classes/
            backend/target/site/jacoco/jacoco.xml

  frontend:
    name: Frontend (lint, build, Vitest ≥ 25%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud (quality gate)
    needs: [backend, frontend]
    # O plano gratuito só avalia o quality gate em Pull Requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: sonar-backend
          path: backend/target

      - uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

      # O lcov do Vitest usa caminhos relativos a frontend/; o Sonar lê a partir da raiz
      - name: Ajustar caminhos do lcov
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # O painel do SonarCloud nem sempre está acessível; se o quality gate falhar, lista os problemas no log
      - name: Listar problemas do SonarCloud
        if: failure() && github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=danisantosss_Orienta-Saude&pullRequest=$PR&issueStatuses=OPEN,CONFIRMED&ps=100" \
            | jq -r '.issues[] | "\(.type) \(.severity) \(.rule) \(.component):\(.line // "-") \(.message)"'
