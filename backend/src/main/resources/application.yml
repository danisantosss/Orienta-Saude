spring:
  application:
    name: orienta-saude
  profiles:
    active: dev

server:
  port: 8080
  # Respeita os cabeçalhos X-Forwarded-* enviados pelo nginx e pelo Azure
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# Profile: dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/orienta_saude?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:orienta-saude-dev-secret-key-min-256-bits-for-hs256-algorithm}
    expiration-ms: 86400000  # 24 horas
  gemini:
    api-key: ${GEMINI_API_KEY:}
    modelo-texto: ${GEMINI_MODELO_TEXTO:gemini-3.5-flash-lite}
    modelo-embedding: ${GEMINI_MODELO_EMBEDDING:gemini-embedding-001}
    timeout-ms: 10000  # 10 s por chamada
    intervalo-tentativas-ms: 2000  # espera entre as tentativas da análise final
    limite-total-analise-ms: 30000 # análise final: 1 chamada + até 2 novas tentativas, 30 s no total
  rag:
    limiar-similaridade: 0.7
    maximo-documentos: 10
    timeout-busca-ms: 8000
  criptografia:
    # Chave AES-256 em Base64 (openssl rand -base64 32). Esta é só para desenvolvimento local.
    chave: ${APP_CRIPTOGRAFIA_CHAVE:ZGV2LWxvY2FsLW9yaWVudGEtc2F1ZGUtMzItYnl0ZXM=}
  seguranca:
    limite-requisicoes-por-minuto: 100
    maximo-falhas-login: 5
    minutos-bloqueio-login: 15
  cors:
    # Vite em desenvolvimento (npm run dev usa a porta 3000; 5173 é a padrão do Vite)
    origens-permitidas: ${APP_CORS_ORIGENS:http://localhost:3000,http://localhost:5173}
  admin:
    # Emails das contas que recebem o papel ADMIN ao subir a aplicação (separados por vírgula)
    emails: ${APP_ADMIN_EMAILS:}
  auditoria:
    retencao-dias: 180  # o mínimo exigido é 90

---
# Profile: prod
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Cria e atualiza as tabelas a partir das entidades
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  gemini:
    api-key: ${GEMINI_API_KEY}
    modelo-texto: ${GEMINI_MODELO_TEXTO:gemini-3.5-flash-lite}
    modelo-embedding: ${GEMINI_MODELO_EMBEDDING:gemini-embedding-001}
    timeout-ms: 10000  # 10 s por chamada
    intervalo-tentativas-ms: 2000  # espera entre as tentativas da análise final
    limite-total-analise-ms: 30000 # análise final: 1 chamada + até 2 novas tentativas, 30 s no total
  rag:
    limiar-similaridade: 0.7
    maximo-documentos: 10
    timeout-busca-ms: 8000
  criptografia:
    # Obrigatória em produção: sem ela a aplicação não sobe. Perder a chave = perder os dados cifrados.
    chave: ${APP_CRIPTOGRAFIA_CHAVE}
  seguranca:
    limite-requisicoes-por-minuto: 100
    maximo-falhas-login: 5
    minutos-bloqueio-login: 15
  cors:
    # O navegador chama a API pelo nginx do frontend (mesma origem), então nada precisa ser liberado
    origens-permitidas: ${APP_CORS_ORIGENS:}
  admin:
    emails: ${APP_ADMIN_EMAILS:}
  auditoria:
    retencao-dias: 180
