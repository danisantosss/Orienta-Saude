spring:
  datasource:
    url: jdbc:tc:mysql:8.0:///orienta_saude_teste
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: test-secret-key-min-256-bits-for-hs256-algorithm-testing-only
    expiration-ms: 86400000
  gemini:
    api-key: test-key
    modelo-texto: modelo-de-teste
    modelo-embedding: embedding-de-teste
    timeout-ms: 5000
    intervalo-tentativas-ms: 0
  rag:
    indexar-na-inicializacao: false
  criptografia:
    chave: dGVzdGUtb3JpZW50YS1zYXVkZS1jaGF2ZS0zMi1ieXQ=
  seguranca:
    # A suíte inteira roda do mesmo IP (127.0.0.1); o teste do limite usa um valor baixo só para ele
    limite-requisicoes-por-minuto: 100000
