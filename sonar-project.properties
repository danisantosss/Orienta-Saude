sonar.host.url=https://sonarcloud.io
sonar.organization=danisantosss
sonar.projectKey=danisantosss_Orienta-Saude
sonar.projectName=Orienta Saúde
sonar.sourceEncoding=UTF-8

# Código de produção e testes (backend Java + frontend React/TS)
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.test.inclusions=backend/src/test/java/**/*.java,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Classes compiladas do backend (geradas no job backend)
sonar.java.binaries=backend/target/classes
sonar.java.source=17

# Relatórios de cobertura gerados no CI
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/vite-env.d.ts

# Reprova o pipeline se o quality gate falhar
sonar.qualitygate.wait=true
